server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Les actifs textuels partent compressés. Mesuré le 15/11/2026 sur host-test-37 : le
    # bundle du portail pesait 843 229 octets (823 Kio) à chaque chargement, rendu à
    # l'octet identique que le client annonce `gzip, br` ou non — nginx ne compresse RIEN
    # par défaut, et c'est payé en entier sur le lien de la personne, pas ici où le
    # fichier sort en 2 ms.
    #
    # Compression à la volée par le module standard de l'image : le brotli n'en fait pas
    # partie, et l'ajouter serait une décision à annoncer, pas un effet de bord.
    gzip on;
    # `gzip on` couvre déjà text/html ; le nommer ici serait un doublon. Les actifs déjà
    # compressés — images, polices woff2 — sont absents de cette liste volontairement :
    # les recomprimer coûte du processeur et rend parfois plus gros.
    gzip_types application/javascript text/javascript application/json
               application/manifest+json image/svg+xml text/css text/plain;
    # En deçà, l'en-tête et le temps processeur coûtent plus que ce qu'on économise.
    gzip_min_length 1024;
    # Les réponses RELAYÉES comptent : la personne atteint ce service à travers le proxy du
    # portail et Cloudflare, qui posent un `Via`. Sans cela, nginx ne compresserait que les
    # requêtes directes — donc aucune de celles qui traversent le lien lent.
    gzip_proxied any;
    # Un intermédiaire doit varier son cache sur l'encodage, sinon un client qui ne sait pas
    # décompresser reçoit les octets compressés d'un autre.
    gzip_vary on;

    # Même origine pour l'IHM et l'API : pas de CORS à ouvrir, et le cookie de
    # session reste limité à ce seul hôte.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Écrasé ici, jamais relayé depuis le client : le backend s'en sert pour
        # freiner les échecs de connexion par origine, il ne doit pas être forgeable.
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Surface MCP (story 0d4e4f75) : gardée par clé d'API dans le backend, pas par la
    # session. Sans mise en tampon : une réponse en flux doit arriver au fil de l'eau.
    location /mcp/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;
        proxy_read_timeout 120s;
        # Pas de compression sur un flux : nginx n'enverrait les octets qu'une fois son
        # tampon de compression rempli, et c'est précisément ce que `proxy_buffering off`
        # cherche à éviter ici.
        gzip off;
    }

    # OAuth de la surface MCP (story 9f09cd8b) : métadonnées et échange de jeton vont au
    # backend. /oauth/authorize, lui, reste à l'IHM : c'est l'écran de connexion et de
    # consentement, servi par index.html comme toute page.
    location /.well-known/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location = /oauth/token {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        try_files $uri /index.html;
    }
}
