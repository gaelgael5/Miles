# Broker MQTT 5 de Miles (Eclipse Mosquitto 2).
listener 1883
# Fail closed : aucun client anonyme ; chaque terminal a son compte.
allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl
# Sessions persistantes conservées sur disque : un terminal déconnecté retrouve,
# à sa reconnexion, la réponse publiée en QoS 1 pendant son absence.
persistence true
persistence_location /mosquitto/data/
log_dest stdout
