server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Même origine pour l'IHM et l'API : pas de CORS à ouvrir, et le cookie de
    # session reste limité à ce seul hôte.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Écrasé ici, jamais relayé depuis le client : le backend s'en sert pour
        # freiner les échecs de connexion par origine, il ne doit pas être forgeable.
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Surface MCP (story 0d4e4f75) : gardée par clé d'API dans le backend, pas par la
    # session. Sans mise en tampon : une réponse en flux doit arriver au fil de l'eau.
    location /mcp/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;
        proxy_read_timeout 120s;
    }

    location / {
        try_files $uri /index.html;
    }
}
