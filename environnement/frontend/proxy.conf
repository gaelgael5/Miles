# Les en-têtes que tout mandatement vers le backend porte, en UN seul endroit.
#
# Trois `location` mandatent désormais — l'IHM, le point d'entrée d'ingestion, et l'essai
# depuis l'écran —, et leurs en-têtes doivent rester identiques : `X-Real-IP` sert au
# backend à freiner les échecs de connexion par origine, et une copie oubliée dans une
# seule des trois lui ferait compter toutes les origines comme une.
#
# Hors de `conf.d/`, délibérément : tout `conf.d/*.conf` est inclus dans le contexte
# `http`, et ces directives s'y appliqueraient globalement au lieu d'être portées par les
# `location` qui les incluent.
proxy_set_header Host $host;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
# Écrasé ici, jamais relayé depuis le client : le backend s'en sert pour freiner les
# échecs de connexion par origine, il ne doit pas être forgeable.
proxy_set_header X-Real-IP $remote_addr;
