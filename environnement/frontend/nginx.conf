server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Même origine pour l'IHM et l'API : pas de CORS à ouvrir, et le cookie de
    # session reste limité à ce seul hôte — c'est aussi ce qui rend la session du
    # module d'environnement étanche à celle des autres produits.
    location /api/ {
        proxy_pass http://backend:8000;
        # Un PLAFOND contre l'abus, et NON la borne métier. La borne métier est
        # `MAX_BODY_BYTES` (8 Mio), appliquée par le backend, et elle est délibérément plus
        # basse : c'est son refus — `corps_trop_grand`, avec sa borne dans `detail` — que
        # l'appelant doit lire, pas une page HTML de nginx qui ne parle pas le langage du
        # contrat. Deux valeurs égales auraient fait de nginx une seconde source de vérité,
        # et le premier relèvement fait d'un seul côté aurait rendu le refus illisible.
        client_max_body_size 16m;
        include /etc/nginx/proxy.conf;
    }

    # L'ESSAI d'une méthode depuis l'écran. Il vit sous /api — il s'authentifie par la
    # session — mais son mode `fichier` relaie un DOCUMENT, et il a donc les besoins du
    # point d'entrée plutôt que ceux de l'IHM : aucune borne ici, et pas de mise en tampon.
    #
    # Une `location` en expression régulière, évaluée avant le préfixe `/api/` : sans elle,
    # le plafond de 16 Mio ci-dessus s'appliquerait et un essai sur un vrai document serait
    # refusé par nginx, sans que le backend le voie. Mesuré le 07/11/2026 (bug `abc1b595`) :
    # le défaut de nginx, 1 Mio, refusait tout dépôt réel sur les deux chemins.
    #
    # Le corps n'est PAS mis en tampon, et c'est ce qui rend la barre de progression de
    # l'écran honnête : avec `proxy_request_buffering on`, nginx accumulerait le document
    # entier sur son disque avant d'en passer un octet au backend. L'envoi monterait à
    # 100 % puis l'écran resterait figé pendant toute l'écriture réelle.
    location ~ ^/api/ingestion/try/ {
        proxy_pass http://backend:8000;
        client_max_body_size 0;
        proxy_request_buffering off;
        include /etc/nginx/proxy.conf;
    }

    # Le point d'entrée d'ingestion, SEULE surface de ce module ouverte à un tiers.
    # Il vit HORS de /api — il s'authentifie par clé d'API et non par session — donc il
    # a besoin de sa propre règle ici : sans elle, `location /` l'attrape comme un
    # fichier statique et nginx refuse le POST par un 405, sans que le backend voie la
    # requête. Mesuré le 02/11/2026 à la première livraison : le backend répondait 401
    # comme il faut, et le port publié rendait 405. Aucun test ne le voyait — ils
    # montent l'application ASGI, jamais le proxy.
    #
    # Le corps n'est pas mis en tampon : un lot de plusieurs mégaoctets n'a pas à être
    # recopié sur le disque de nginx avant d'atteindre le backend, qui le borne lui-même.
    #
    # Et AUCUNE borne de taille ici : c'est `ingestion_file_max_bytes` (2 Gio par défaut)
    # et le quota de disque du storage qui décident, l'un sur la taille annoncée, l'autre
    # sur la taille mesurée en cours d'écriture. Le défaut de nginx — 1 Mio — rendait
    # inatteignables les 2 Gio que le contrat publié annonce, et son 413 en HTML n'était
    # pas le `fichier_trop_grand` que le partenaire attend (bug `abc1b595`, mesuré le
    # 07/11/2026 : 1 049 000 octets refusés par nginx, requête jamais vue du backend).
    location /ingest/ {
        proxy_pass http://backend:8000;
        client_max_body_size 0;
        proxy_request_buffering off;
        include /etc/nginx/proxy.conf;
    }

    location / {
        try_files $uri /index.html;
    }
}
