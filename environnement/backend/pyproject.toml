[project]
name = "miles-environnement"
version = "0.1.0"
description = "Module d'environnement de Miles : identité signée de l'environnement, et le back-office à venir"
requires-python = ">=3.12"
# Le socle apporte argon2-cffi, asyncpg, cryptography, fastapi, httpx, pydantic, pyjwt et
# structlog : on ne les redéclare pas ici. Ne figurent que ce dont le produit a besoin en
# propre — la lecture de sa configuration et le serveur qui l'expose.
dependencies = [
    # AUCUNE bibliothèque de lecture JSON en flux, et c'est une décision mesurée du
    # 07/11/2026 : le mode gros fichier lit ses items par `json.JSONDecoder.raw_decode`
    # sur une fenêtre glissante (`ingestion/jsonwindow.py`), soit la bibliothèque
    # standard. json-stream 2.3.3, qui tenait ce rôle, a été retiré ici — son tokeniseur
    # rendait chaque JETON à Python, ce qui coûtait 858 µs par item là où la fenêtre en
    # coûte 104. Ne pas le réintroduire, ni ijson, ni orjson, sans refaire la mesure :
    # elle est consignée dans l'enabler « Lire les items d'un gros fichier par fenêtre
    # glissante » et dans les docstrings des deux modules.
    "jsonschema==4.26.0",
    # Le validateur COMPILÉ du chemin rapide du contrôle de modèle (07/11/2026). Mesuré
    # 2,5 µs par objet contre 52,9 pour `jsonschema`, soit 20,9x sur un poste qui était
    # alors le second d'un import. Il n'est PAS une autorité et ne remplace pas
    # `jsonschema` : il ne décide que d'accepter, et seulement pour les schémas dont tous
    # les mots-clés ont été mesurés en accord — voir `ingestion/conformance.py`, dont la
    # docstring porte la mesure, et le test qui tient la liste. Version ÉPINGLÉE : une
    # montée peut faire diverger un mot-clé en silence, et c'est le test qui l'attrape.
    "fastjsonschema==2.22.3",
    # L'extra `transform` : le moteur JSLT, pour appliquer la chaîne d'une entrée de
    # source aux objets reçus (story d680e811). Jamais une dépendance DIRECTE à
    # urban-json — deux déclarations de version finiraient par diverger, et c'est le
    # socle qui porte le code qui l'importe.
    "miles-socle[transform]",
    "pydantic-settings>=2.6",
    "uvicorn[standard]>=0.32",
]

[project.scripts]
miles-env-contracts = "environnement.published_contracts:main"
environnement-migrate = "environnement.cli:main"
# Entièrement générique : le point d'entrée est celui du socle, sans glu côté produit.
environnement-admin = "miles_socle.auth.cli_admin:main"

[tool.uv.sources]
# Le socle vit hors du répertoire du produit : il est partagé par les trois produits du
# dépôt. Le chemin relatif vaut tel quel dans l'image, qui reproduit la disposition du
# dépôt — `environnement/backend/../../socle/python` et `/src/environnement/backend/../../socle/python`
# désignent le même emplacement, ce qui évite une seconde configuration pour Docker.
# uv REFUSE un chemin relatif qui remonte au-dessus de son répertoire de base : voir
# le commentaire du Dockerfile, et LESSONS.md au 27/10/2026.
miles-socle = { path = "../../socle/python", editable = true }

[dependency-groups]
dev = [
    "asyncpg-stubs>=0.30",
    "httpx>=0.27",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "types-jsonschema>=4.26.0.20261006",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/environnement"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = ["integration: exige une vraie base PostgreSQL (MILES_TEST_DATABASE_URL)"]
# Les tests d'intégration ne tournent que sur demande explicite (-m integration),
# sur une machine de test : le poste de dev n'a pas de PostgreSQL.
addopts = "-m 'not integration'"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "ASYNC", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Les tests manipulent des mots de passe d'essai, sans valeur hors des tests.
"tests/**" = ["S101", "S105", "S106"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["environnement"]
