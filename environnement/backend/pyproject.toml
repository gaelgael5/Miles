[project]
name = "miles-environnement"
version = "0.1.0"
description = "Module d'environnement de Miles : identité signée de l'environnement, et le back-office à venir"
requires-python = ">=3.12"
# Le socle apporte argon2-cffi, asyncpg, cryptography, fastapi, httpx, pydantic, pyjwt et
# structlog : on ne les redéclare pas ici. Ne figurent que ce dont le produit a besoin en
# propre — la lecture de sa configuration et le serveur qui l'expose.
dependencies = [
    # Le parseur JSON en FLUX du mode gros fichier (story 0f14adbd). CHOISI SUR MESURE,
    # et non sur la réputation : sur un document de 10,4 Mo fait de 20 000 items sans
    # espaces, ijson 3.4 en backend pur-Python monte à 8,6 Mo de pic et 1,00 s, parce que
    # son lexer n'abandonne le préfixe consommé du tampon qu'au bout d'un lexème non
    # trouvé ; json-stream reste à 0,15 Mo et 0,62 s. Et ijson n'aurait tenu la promesse
    # du critère 1 que dans l'image : son backend C est absent du poste de développement
    # (pas de roue pour 3.14), donc la mesure n'y aurait rien prouvé.
    # Dépendance du PRODUIT et non du socle : lui seul reçoit des fichiers, et on
    # n'invente pas un socle commun avant d'avoir deux usages à servir.
    "json-stream==2.3.3",
    "jsonschema==4.26.0",
    # L'extra `transform` : le moteur JSLT, pour appliquer la chaîne d'une entrée de
    # source aux objets reçus (story d680e811). Jamais une dépendance DIRECTE à
    # urban-json — deux déclarations de version finiraient par diverger, et c'est le
    # socle qui porte le code qui l'importe.
    "miles-socle[transform]",
    "pydantic-settings>=2.6",
    "uvicorn[standard]>=0.32",
]

[project.scripts]
miles-env-contracts = "environnement.published_contracts:main"
environnement-migrate = "environnement.cli:main"
# Entièrement générique : le point d'entrée est celui du socle, sans glu côté produit.
environnement-admin = "miles_socle.auth.cli_admin:main"

[tool.uv.sources]
# Le socle vit hors du répertoire du produit : il est partagé par les trois produits du
# dépôt. Le chemin relatif vaut tel quel dans l'image, qui reproduit la disposition du
# dépôt — `environnement/backend/../../socle/python` et `/src/environnement/backend/../../socle/python`
# désignent le même emplacement, ce qui évite une seconde configuration pour Docker.
# uv REFUSE un chemin relatif qui remonte au-dessus de son répertoire de base : voir
# le commentaire du Dockerfile, et LESSONS.md au 27/10/2026.
miles-socle = { path = "../../socle/python", editable = true }

[dependency-groups]
dev = [
    "asyncpg-stubs>=0.30",
    "httpx>=0.27",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "types-jsonschema>=4.26.0.20261006",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/environnement"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = ["integration: exige une vraie base PostgreSQL (MILES_TEST_DATABASE_URL)"]
# Les tests d'intégration ne tournent que sur demande explicite (-m integration),
# sur une machine de test : le poste de dev n'a pas de PostgreSQL.
addopts = "-m 'not integration'"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "ASYNC", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Les tests manipulent des mots de passe d'essai, sans valeur hors des tests.
"tests/**" = ["S101", "S105", "S106"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["environnement"]

# json-stream ne porte pas de marqueur `py.typed` : ses symboles arrivent donc en `Any`.
# Écart ASSUMÉ et BORNÉ à ce paquet — c'est le seul du dépôt dans ce cas. Les deux modules
# qui l'importent ne laissent rien fuir au-delà d'eux : ils rendent des valeurs JSON, dont
# le type est `Any` de toute façon, et c'est le schéma du modèle qui les contraint ensuite.
[[tool.mypy.overrides]]
module = ["json_stream.*"]
ignore_missing_imports = true
