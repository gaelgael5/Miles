name: miles

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: miles
      POSTGRES_USER: miles
      # Généré sur l'hôte par dev-deploy.sh dans .env (non versionné), jamais dans l'image.
      POSTGRES_PASSWORD: ${MILES_DB_PASSWORD:?MILES_DB_PASSWORD absent de .env — lancer dev-deploy.sh}
    volumes:
      - miles-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U miles -d miles"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      target: runtime
    environment:
      MILES_DATABASE_URL: postgresql://miles:${MILES_DB_PASSWORD:?}@db:5432/miles
      MILES_LOG_LEVEL: ${MILES_LOG_LEVEL:-info}
      MILES_ENV_FILE: /run/miles/.env
      MILES_ENV_BACKUP_FILE: /run/miles/.env.bak
      MILES_COOKIE_SECURE: ${MILES_COOKIE_SECURE:-true}
    volumes:
      # Fichier par fichier, pas le dossier du dépôt (décision du 19/10/2026) : le
      # backend y écrit le compte d'amorçage, et .env.bak sert à restaurer .env si
      # cette écriture est interrompue. dev-deploy.sh crée les deux avant le démarrage.
      - ./.env:/run/miles/.env
      - ./.env.bak:/run/miles/.env.bak
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      target: runtime
    ports:
      - "${MILES_HTTP_PORT:-8080}:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  miles-db:
